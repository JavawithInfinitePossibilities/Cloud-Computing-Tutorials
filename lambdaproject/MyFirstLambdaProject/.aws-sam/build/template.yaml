AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'MyFirstLambdaProject

  Sample SAM Template for MyFirstLambdaProject

  '
Globals:
  Function:
    Timeout: 20
    MemorySize: 512
Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: HelloWorldFunction
      Handler: com.tutorial.sid.spring.DataTypes::coldstartBasics
      Runtime: java21
      Architectures:
      - x86_64
      MemorySize: 512
      Timeout: 6
      Environment:
        Variables:
          restapiurl: testurl
    Metadata:
      SamResourceId: HelloWorldFunction
